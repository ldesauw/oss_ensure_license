name: "OSS Ensure License"
description: >-
  Generate and verify a LICENSES/ folder for a Go module (OVH-style): one
  LICENSE file per dependency plus a LICENSES.txt summary.
author: "OVH SAS"

branding:
  icon: "book-open"
  color: "blue"

inputs:
  mode:
    description: >-
      "check" fails the job when the committed LICENSES folder is out of date.
      "write" regenerates it in place (git is left to your workflow).
      "pr" regenerates it and, if anything changed, opens or updates a pull
      request.
    required: false
    default: "check"
  packages:
    description: "Go packages to scan."
    required: false
    default: "./..."
  output-dir:
    description: "Folder to write, relative to working-directory."
    required: false
    default: "LICENSES"
  working-directory:
    description: "Directory of the Go module to scan."
    required: false
    default: "."
  go-version:
    description: >-
      Go version for actions/setup-go (e.g. "1.26"). If empty, go-version-file
      is used instead.
    required: false
    default: ""
  go-version-file:
    description: "File to read the Go version from, relative to working-directory."
    required: false
    default: "go.mod"
  go-licenses-version:
    description: "Pinned github.com/google/go-licenses/v2 version."
    required: false
    default: "v2.0.1"
  fail-on-licenses:
    description: >-
      Comma-separated SPDX ids that must NOT appear (e.g. "GPL-3.0,AGPL-3.0").
      Empty disables the check.
    required: false
    default: ""

  # --- Pull-request options (mode: pr) --------------------------------------
  token:
    description: >-
      Token used to push the branch and open the pull request. Defaults to the
      workflow's GITHUB_TOKEN. Note that GITHUB_TOKEN can only open PRs when
      "Allow GitHub Actions to create and approve pull requests" is enabled;
      otherwise supply a PAT or GitHub App token here.
    required: false
    default: ""
  pr-branch:
    description: "Head branch used for the pull request."
    required: false
    default: "chore/update-licenses"
  pr-base:
    description: "Base branch of the pull request. Defaults to the current ref."
    required: false
    default: ""
  pr-title:
    description: "Pull request title."
    required: false
    default: "chore: update LICENSES folder"
  pr-body:
    description: "Pull request body."
    required: false
    default: "Automated update of the LICENSES folder by the OSS Ensure License action."
  pr-labels:
    description: "Comma-separated labels to apply to the pull request (must already exist)."
    required: false
    default: ""
  commit-message:
    description: "Commit message for the regenerated folder."
    required: false
    default: "chore: update LICENSES folder"
  git-user-name:
    description: "Author/committer name for the commit."
    required: false
    default: "github-actions[bot]"
  git-user-email:
    description: "Author/committer email for the commit."
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"

outputs:
  changed:
    description: '"true" if regenerating changed the LICENSES folder, else "false".'
    value: ${{ steps.generate.outputs.changed }}
  summary:
    description: "Path to the generated LICENSES.txt (relative to working-directory)."
    value: ${{ steps.generate.outputs.summary }}
  licenses:
    description: "Comma-separated unique licences found."
    value: ${{ steps.generate.outputs.licenses }}
  pull-request-url:
    description: "URL of the pull request opened or updated in mode: pr (empty otherwise)."
    value: ${{ steps.pr.outputs.pull-request-url }}

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.working-directory }}/${{ inputs.go-version-file }}
        cache-dependency-path: ${{ inputs.working-directory }}/go.sum

    - name: Generate & check LICENSES
      id: generate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MODE: ${{ inputs.mode }}
        GEN_LICENSES_PACKAGES: ${{ inputs.packages }}
        GEN_LICENSES_OUTPUT_DIR: ${{ inputs.output-dir }}
        GEN_LICENSES_VERSION: ${{ inputs.go-licenses-version }}
        GEN_LICENSES_FAIL_ON: ${{ inputs.fail-on-licenses }}
      run: |
        set -euo pipefail

        # Regenerate the folder (also runs the optional forbidden-licence gate).
        "${GITHUB_ACTION_PATH}/hack/gen-licenses.sh"

        out="${GEN_LICENSES_OUTPUT_DIR}"

        # Outputs.
        if [ -n "$(git status --porcelain -- "${out}")" ]; then
          changed="true"
        else
          changed="false"
        fi
        licenses="$(sed -n '/^Licences:/,/^$/p' "${out}/LICENSES.txt" \
          | sed '1d;/^[[:space:]]*$/d' | paste -sd, -)"
        {
          echo "changed=${changed}"
          echo "summary=${out}/LICENSES.txt"
          echo "licenses=${licenses}"
        } >> "${GITHUB_OUTPUT}"

        echo "changed=${changed}; licenses=${licenses}"

        # In check mode, drift is a failure.
        if [ "${MODE}" = "check" ] && [ "${changed}" = "true" ]; then
          echo "::error::${out}/ is out of date. Re-run this action with mode: write or pr and commit the result."
          git --no-pager diff -- "${out}" || true
          git status --porcelain -- "${out}"
          exit 1
        fi

    - name: Open pull request
      id: pr
      if: ${{ inputs.mode == 'pr' && steps.generate.outputs.changed == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        GH_REPO: ${{ github.repository }}
        API_URL: ${{ github.api_url }}
        OUT: ${{ inputs.output-dir }}
        PR_BRANCH: ${{ inputs.pr-branch }}
        PR_BASE: ${{ inputs.pr-base }}
        DEFAULT_BASE: ${{ github.ref_name }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        PR_LABELS: ${{ inputs.pr-labels }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: "${GITHUB_ACTION_PATH}/hack/open-pr.sh"
