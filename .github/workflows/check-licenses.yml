name: check-licenses

# Self-test / live example: run this repository's own action against its
# (dummy) Go module and fail if the committed LICENSES/ folder is stale.
on:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "hack/gen-licenses.sh"
      - "action.yml"
      - "LICENSES/**"
      - ".github/workflows/check-licenses.yml"

permissions:
  contents: read

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          mode: check
