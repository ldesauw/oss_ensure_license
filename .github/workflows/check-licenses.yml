name: check-licenses

# Self-test / live example: run this repository's own action against the
# example Go module in testdata/ and fail if its committed LICENSES/ folder is
# stale.
on:
  pull_request:
    paths:
      - "action.yml"
      - "hack/gen-licenses.sh"
      - "testdata/example-module/**"
      - ".github/workflows/check-licenses.yml"

permissions:
  contents: read

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          mode: check
          working-directory: testdata/example-module
