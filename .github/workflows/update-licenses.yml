name: update-licenses

# Self-test / live example: regenerate the example module's LICENSES/ with this
# repository's own action and let the action open a PR when it drifts.
on:
  push:
    branches: [main]
    paths:
      - "action.yml"
      - "hack/gen-licenses.sh"
      - "testdata/example-module/go.mod"
      - "testdata/example-module/go.sum"
      - ".github/workflows/update-licenses.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        with:
          mode: pr
          working-directory: testdata/example-module
          pr-labels: "dependencies,licenses"
