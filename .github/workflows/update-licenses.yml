name: update-licenses

# Self-test / live example: regenerate the example module's LICENSES/ with this
# repository's own action (mode: write) and open a PR when it drifts.
on:
  push:
    branches: [main]
    paths:
      - "action.yml"
      - "hack/gen-licenses.sh"
      - "testdata/example-module/go.mod"
      - "testdata/example-module/go.sum"
      - ".github/workflows/update-licenses.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          mode: write
          working-directory: testdata/example-module

      - name: Open PR if LICENSES changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update LICENSES folder"
          title: "chore: update LICENSES folder"
          body: |
            Automated update of the example module's `LICENSES/` folder.

            Regenerated by the Endure Licence action (mode: write).
          branch: chore/update-licenses
          delete-branch: true
          add-paths: testdata/example-module/LICENSES
          labels: dependencies, licenses
