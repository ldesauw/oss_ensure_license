name: update-licenses

# Regenerates the LICENSES/ folder and opens a PR when it drifts from the
# committed version. Runs when dependencies change, on a weekly safety net,
# and on demand.
on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "hack/gen-licenses.sh"
      - ".github/workflows/update-licenses.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Regenerate LICENSES folder
        run: ./hack/gen-licenses.sh

      - name: Open PR if LICENSES changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update LICENSES folder"
          title: "chore: update LICENSES folder"
          body: |
            Automated update of the `LICENSES/` folder.

            Regenerated by `hack/gen-licenses.sh` (google/go-licenses).
            No changes here means the committed licences already match the
            current dependency set.
          branch: chore/update-licenses
          delete-branch: true
          add-paths: LICENSES
          labels: dependencies, licenses
