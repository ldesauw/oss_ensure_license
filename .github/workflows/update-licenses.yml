name: update-licenses

# Self-test / live example: regenerate LICENSES/ with this repository's own
# action (mode: write) and open a PR when it drifts.
on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "hack/gen-licenses.sh"
      - "action.yml"
      - ".github/workflows/update-licenses.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          mode: write

      - name: Open PR if LICENSES changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update LICENSES folder"
          title: "chore: update LICENSES folder"
          body: |
            Automated update of the `LICENSES/` folder.

            Regenerated by the `go-licenses-folder` action (mode: write).
          branch: chore/update-licenses
          delete-branch: true
          add-paths: LICENSES
          labels: dependencies, licenses
