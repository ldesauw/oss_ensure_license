name: Bug report
description: Report a problem with the Endure Licence action
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow snippet
      description: The step invoking the action (with inputs).
      render: yaml
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: The job output around the failure.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Action version
      description: e.g. v1, v1.0.0, or a commit SHA.
    validations:
      required: true
